{n:179,t:T.U,y:"mc",q:"User EMEALevel2Support has rights: Add/Update Users, Manage Server File Categories, Manage Directory Mapping, Backup All Files, Restore All Files. Why can't they change the password for user 'Operator'?",o:["EMEALevel2Support's hierarchy level is not the same or higher than Operator","EMEALevel2Support lacks the 'Manage Directory Mapping' role","Operator can only be reset by the Master user","EMEALevel2Support does not have rights to reset passwords for other users"],a:[3],e:"None of the listed authorizations includes resetting other users' passwords — the reset-password right is missing."},
{n:180,t:T.M,y:"multi",q:"Which processes reduce the risk of credential theft? (Choose two)",o:["Require dual control password access approval","Require password change every X days","Enforce check-in/check-out exclusive access","Enforce one-time password access"],a:[1,3],e:"Regular rotation + one-time passwords shrink the window a stolen credential is useful. (Dual control = collusion; exclusive = accountability.)"},
{n:181,t:T.C,y:"mc",q:"When an account is unable to change its own password, how can you ensure that password RESET with the reconcile account is performed each time instead of a change?",o:["Set RCAllowManualReconciliation to Yes","Set ChangePasswordinResetMode to Yes","Set IgnoreReconcileOnMissingAccount to No","Set UnlockUserOnReconcile to Yes"],a:[2],e:"Keyed: IgnoreReconcileOnMissingAccount = No — the reconcile account (which CAN reset others' passwords) is used each time."},
{n:182,t:T.R,y:"multi",q:"Which Vault authorizations does a user need to generate the Entitlement Report from the PVWA Reports page? (Choose two)",o:["Manage Users","Audit Users","Read Activity","View Entitlements","List Accounts"],a:[1,3],e:"Keyed: Audit Users + View Entitlements."},
{n:183,t:T.P,y:"order",q:"From the PVWA, arrange the steps to configure a PSM host to use a new HTML5 Gateway in the correct sequence.",o:["Log in to the PVWA with an administrative user","Navigate to Administration > Options","Right-click Privileged Session Management, then select Add Configured PSM Gateway Servers","Right-click Configured PSM Gateway Servers, then Add PSM Gateway Server","Enter a unique ID for the PSM HTML5 Gateway server","Expand the newly created gateway server and enter the configuration details"],a:[],e:"PVWA admin login → Options → add the Configured PSM Gateway Servers section → add a gateway server → unique ID → fill in details."},
{n:184,t:T.U,y:"mc",q:"What do you need ON THE VAULT to support LDAP over SSL?",o:["CA Certificate(s) used to sign the External Directory certificate","RECPRV.key","A private key for the external directory","Self-signed certificate(s) for the Vault"],a:[0],e:"Import the signing CA cert(s) into the Vault's Windows certificate store to trust the LDAPS connection."},
{n:185,t:T.S,y:"mc",q:"In addition to 'add accounts' and 'update account contents', which additional safe permission is required to add a single account?",o:["Upload Accounts Properties","Rename Accounts","Update Account Properties","Manage Safe"],a:[2],e:"Adding a single account also needs Update Account Properties (to set the account's properties)."},
{n:186,t:T.P,y:"mc",q:"Due to storage constraints, you must disable session monitoring and recording for 500 test accounts. How do you accomplish this?",o:["Master Policy > Session Management > add Exceptions to the platform(s) > disable Session Monitoring and Recording policies","Administration > Platform Management > select the platform(s) > disable Session Monitoring and Recording","Policies > Access Control (Safes) > select the safe(s) > disable policies","Administration > Configuration Options > Options > Privilege Session Management > disable policies"],a:[3],e:"⚠ Keyed D, but community most-voted is B (Platform Management — docs-supported). At minimum remember: this is NOT done per-safe."},

S.stats=S.stats||{};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const stat=n=>S.stats[n]||{box:0,seen:0,c:0,w:0};
function setStat(n,ok){const s=stat(n);s.seen++;if(ok){s.c++;s.box=Math.min(3,Math.max(s.box,1)+1)}else{s.w++;s.box=1}S.stats[n]=s;save();pushCloud()}

const TOPICS=Object.values(T);
const app=document.getElementById("app");
const pill=document.getElementById("toppill");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtExp(e){return esc(e).replace(/⚠[^.]*\./g,m=>'<span class="warnnote">'+m+'</span>')}
function weightedPick(pool,count){
  const arr=pool.map(q=>{const s=S.stats[q.n];const w=(!s||!s.seen)?5:[5,4,1.6,0.5][s.box];return{q,w}});
  const out=[];
  while(out.length<count&&arr.length){
    let tot=0;for(const x of arr)tot+=x.w;
    let r=Math.random()*tot,idx=arr.length-1;
    for(let i=0;i<arr.length;i++){r-=arr[i].w;if(r<=0){idx=i;break}}
    out.push(arr[idx].q);arr.splice(idx,1);
  }
  return out;
}
let sess=null;
function goHome(){if(sess&&sess.tick)clearInterval(sess.tick);sess=null;home()}
function counts(pool){let seen=0,m=0;pool.forEach(q=>{const s=S.stats[q.n];if(s&&s.seen){seen++;if(s.box>=3)m++}});return{seen,m}}
function home(){

  }).join("");
  app.innerHTML=`
  <div class="card">
    <h1>CyberArk Defender – PAM</h1>

    <button class="mode" onclick="browse('All')"><span class="ic">📚</span><b>Browse & Cram</b><small>Flashcard mode — flip through every question with answers & explanations</small></button>
    <button class="mode" onclick="marathonSetup()"><span class="ic">🏁</span><b>Full Marathon</b><small>All ${QUESTIONS.length} questions in the original order · choose your own time limit · instant answers${S.marathon&&S.marathon.results&&S.marathon.results.length<QUESTIONS.length?` · <b style='color:var(--warn)'>resume at Q${S.marathon.results.length+1}</b>`:""}</small></button>
  </div>

}
function startQuick(){begin({title:"Quick Quiz",pool:QUESTIONS,count:10,defer:false})}
function startSmart(){begin({title:"Smart Review",pool:QUESTIONS,count:20,defer:false})}
function startExam(){begin({title:"Exam Simulator",pool:QUESTIONS,count:65,defer:true,random:true})}
function marathonSetup(){
  const m=S.marathon;
  if(m&&m.results&&m.results.length<QUESTIONS.length){
    if(confirm("Resume your marathon at question "+(m.results.length+1)+" of "+QUESTIONS.length+"?\n\n(Cancel discards the saved run and lets you start over.)")){startMarathon(-1);return}
    delete S.marathon;save();
  }
  app.innerHTML=`
  <div class="card">
    <div class="qmeta"><h2 style="margin:0">🏁 Full Marathon</h2><span style="flex:1"></span><span class="tag" style="cursor:pointer" onclick="goHome()">← Home</span></div>
    <div class="sub">All ${QUESTIONS.length} questions in the original order, with the answer and explanation shown after every question — the fastest way to memorize the whole bank. Your position is saved after each answer, so you can pause anytime and resume where you left off.</div>
    <h2 style="margin-top:14px">Choose a time limit</h2>
    <div class="rowbtns">
      <button class="btn ghost" onclick="startMarathon(0)">No timer</button>
      <button class="btn ghost" onclick="startMarathon(60)">1 hour</button>
      <button class="btn ghost" onclick="startMarathon(90)">1.5 hours</button>
      <button class="btn ghost" onclick="startMarathon(120)">2 hours</button>
      <button class="btn ghost" onclick="startMarathon(180)">3 hours</button>
      <button class="btn ghost" onclick="startMarathon(240)">4 hours</button>
    </div>
    <div class="rowbtns" style="align-items:center;margin-top:6px">
      <input class="search" id="marMin" type="number" min="5" max="600" placeholder="Custom minutes" style="max-width:190px;margin:0">
      <button class="btn" onclick="const v=parseInt(document.getElementById('marMin').value,10);if(v>0)startMarathon(v)">Start with custom time</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function startMarathon(mins){
  let resume=null;
  if(mins===-1){resume=S.marathon;mins=0}
  sess={title:"Full Marathon",qs:QUESTIONS.slice(),i:resume?resume.results.length:0,answered:false,
    results:resume?resume.results.slice():[],defer:false,marathon:true,
    deadline:(resume?resume.left>0:mins>0)?Date.now()+(resume?resume.left*1000:mins*60000):0,tick:null};
  if(sess.deadline)sess.tick=setInterval(updateTimer,1000);
  if(sess.i>=sess.qs.length){finish();return}
  renderQ();
}
function saveMarathon(){
  S.marathon={results:sess.results.slice(),left:sess.deadline?Math.max(0,Math.round((sess.deadline-Date.now())/1000)):0};
  save();
}
function startTopic(t){begin({title:t,pool:QUESTIONS.filter(q=>q.t===t),count:15,defer:false})}
function retry(ns){begin({title:"Retry missed",pool:ns.map(n=>byN[n]),count:ns.length,defer:false,random:true})}
function begin(o){
  const qs=o.random?shuffle(o.pool).slice(0,o.count):weightedPick(o.pool,Math.min(o.count,o.pool.length));
  if(!qs.length){alert("No questions available.");return}
  sess={...o,qs,i:0,answered:false,results:[],deadline:o.defer?Date.now()+90*60*1000:0,tick:null};
  if(o.defer)sess.tick=setInterval(updateTimer,1000);
  renderQ();
}
function updateTimer(){
  if(!sess||!sess.deadline)return;
  const el=document.getElementById("timer");
  const ms=sess.deadline-Date.now();
  if(ms<=0){finish();return}
  if(el){
    const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
    el.textContent=m>=60?Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s).padStart(2,"0"):String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }
}
function renderQ(){
  const q=sess.qs[sess.i];
  sess.answered=false;sess.sel=new Set();sess.seq=[];
  let body="";
  if(q.y==="mc"||q.y==="multi"){
    body=q.o.map((op,i)=>`<button class="opt" id="opt${i}" onclick="pickOpt(${i})"><span class="lt">${LETTERS[i]}.</span>${esc(op)}</button>`).join("");
  }else if(q.y==="order"){
    sess.disp=shuffle(q.o.map((_,i)=>i));
    body=`<div class="hint">Tap the steps in the correct order. Tap a placed step to remove it.</div><div class="seqzone" id="seq"></div><div id="bank"></div>`;
  }else if(q.y==="match"){
    const rights=[...new Set(q.p.map(p=>p[1]))];
    body=`<div class="hint">Match each item on the left to the correct option.</div>`+q.p.map((p,i)=>`<div class="mrow"><div class="ml">${esc(p[0])}</div><select id="m${i}"><option value="">— select —</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>`).join("");
  }
  const needSubmit=q.y!=="mc"||sess.defer;
  const multiHint=q.y==="multi"?`<div class="hint">Select ${q.a.length} answer${q.a.length>1?"s":""}.</div>`:"";
  app.innerHTML=`
  <div class="card">
    <div class="qmeta">
      <span class="tag">${esc(sess.title)}</span>
      <span class="tag">Q${q.n} · ${esc(q.t)}</span>
      <span style="flex:1"></span>
      <span>${sess.i+1} / ${sess.qs.length}</span>
      ${sess.deadline?'<span class="timer" id="timer"></span>':""}
      <span class="tag" style="cursor:pointer" onclick="quitConfirm()">✕ end</span>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    ${multiHint}${body}
    <div id="fb"></div>
    <div class="rowbtns">
      ${needSubmit?`<button class="btn" id="submitBtn" onclick="submitA()" ${q.y==="mc"?"disabled":""}>${sess.defer?"Next →":"Check answer"}</button>`:""}
    </div>
  </div>`;
  if(q.y==="order")refreshOrder();
  if(sess.deadline)updateTimer();
  window.scrollTo(0,0);
}
function refreshOrder(){
  const q=sess.qs[sess.i];
  const seq=document.getElementById("seq"),bank=document.getElementById("bank");
  seq.innerHTML=sess.seq.length?sess.seq.map((idx,k)=>`<button class="step" onclick="unplace(${k})"><span class="num">${k+1}.</span>${esc(q.o[idx])}</button>`).join(""):'<div class="empty">Your sequence appears here…</div>';
  bank.innerHTML=sess.disp.filter(i=>!sess.seq.includes(i)).map(i=>`<button class="step" onclick="place(${i})">${esc(q.o[i])}</button>`).join("");
  const b=document.getElementById("submitBtn");if(b)b.disabled=sess.answered||sess.seq.length!==q.o.length;
}
function place(i){if(sess.answered)return;sess.seq.push(i);refreshOrder()}
function unplace(k){if(sess.answered)return;sess.seq.splice(k,1);refreshOrder()}
function pickOpt(i){
  if(sess.answered)return;
  const q=sess.qs[sess.i];
  if(q.y==="mc"){
    sess.sel=new Set([i]);
    if(!sess.defer){submitA();return}
    q.o.forEach((_,j)=>document.getElementById("opt"+j).classList.toggle("sel",j===i));
    const b=document.getElementById("submitBtn");if(b)b.disabled=false;
  }else{
    if(sess.sel.has(i))sess.sel.delete(i);else sess.sel.add(i);
    document.getElementById("opt"+i).classList.toggle("sel",sess.sel.has(i));
    const b=document.getElementById("submitBtn");if(b)b.disabled=sess.sel.size===0;
  }
}
function grade(q){
  if(q.y==="mc")return sess.sel.size===1&&q.a.includes([...sess.sel][0]);
  if(q.y==="multi")return sess.sel.size===q.a.length&&q.a.every(i=>sess.sel.has(i));
  if(q.y==="order")return sess.seq.length===q.o.length&&sess.seq.every((v,k)=>v===k);
  if(q.y==="match")return q.p.every((p,i)=>{const el=document.getElementById("m"+i);return el&&el.value===p[1]});
  return false;
}
function answerText(q){
  if(q.y==="mc"||q.y==="multi")return q.a.map(i=>LETTERS[i]+". "+q.o[i]).join("  ·  ");
  if(q.y==="order")return q.o.map((s,i)=>(i+1)+". "+s).join("\n");
  if(q.y==="match")return q.p.map(p=>p[0]+" → "+p[1]).join("\n");
  return"";
}
function submitA(){
  if(!sess)return;
  if(sess.answered){nextQ();return}
  const q=sess.qs[sess.i];
  const ok=grade(q);
  sess.answered=true;
  sess.results.push({n:q.n,ok});
  setStat(q.n,ok);
  if(sess.marathon)saveMarathon();
  if(sess.defer){nextQ();return}
  showFeedback(q,ok);
}
function showFeedback(q,ok){
  if(q.y==="mc"||q.y==="multi"){
    q.o.forEach((_,i)=>{
      const el=document.getElementById("opt"+i);el.disabled=true;
      if(q.a.includes(i))el.classList.add("ok");
      else if(sess.sel.has(i))el.classList.add("bad");
    });
  }else if(q.y==="match"){
    q.p.forEach((p,i)=>{const el=document.getElementById("m"+i);el.disabled=true;el.classList.add(el.value===p[1]?"ok":"bad")});
  }else if(q.y==="order"){
    document.querySelectorAll("#seq .step,#bank .step").forEach(el=>el.disabled=true);
  }
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="fb ${ok?"good":"badf"}">
    <div class="verdict ${ok?"g":"b"}">${ok?"✓ Correct":"✗ Incorrect"}</div>
    <div class="ans"><b>Answer:</b> <span style="white-space:pre-wrap">${esc(answerText(q))}</span></div>
    <div class="exp">${fmtExp(q.e)}</div>
  </div>`;
  const b=document.getElementById("submitBtn");
  if(b){b.disabled=false;b.textContent=sess.i+1>=sess.qs.length?"Finish":"Next →"}
  else{
    fb.insertAdjacentHTML("afterend",`<div class="rowbtns"><button class="btn" id="submitBtn" onclick="submitA()">${sess.i+1>=sess.qs.length?"Finish":"Next →"}</button></div>`);
  }
  document.getElementById("submitBtn").focus();
}
function nextQ(){
  sess.i++;
  if(sess.i>=sess.qs.length){finish();return}
  renderQ();
}
function quitConfirm(){
  if(sess.results.length){
    const msg=sess.marathon?"Pause and exit? Your marathon position is saved — resume anytime from Full Marathon.":"End this session?";
    if(!confirm(msg))return;
  }
  goHome();
}
function finish(){
  if(sess.tick)clearInterval(sess.tick);
  if(sess.marathon){delete S.marathon;save()}
  const res=sess.results;
  const answeredNs=res.map(r=>r.n);
  sess.qs.forEach(q=>{if(!answeredNs.includes(q.n)&&sess.defer)res.push({n:q.n,ok:false})});
  const total=sess.qs.length,correct=res.filter(r=>r.ok).length;
  const pct=total?Math.round(100*correct/total):0;
  const missed=res.filter(r=>!r.ok).map(r=>r.n);
  const isExam=sess.defer;
  const pass=pct>=70;
  const perTopic={};
  res.forEach(r=>{const q=byN[r.n];perTopic[q.t]=perTopic[q.t]||{c:0,t:0};perTopic[q.t].t++;if(r.ok)perTopic[q.t].c++});
  const topicHtml=Object.entries(perTopic).map(([t,v])=>`<div class="trow"><div class="tname"><b>${esc(t)}</b><div class="bar" style="margin-top:5px"><i style="width:${Math.round(100*v.c/v.t)}%"></i></div></div><span class="small">${v.c}/${v.t}</span></div>`).join("");
  const missedHtml=missed.map(n=>{const q=byN[n];return`<div class="card"><div class="qmeta"><span class="tag">Q${q.n} · ${esc(q.t)}</span></div><div style="font-weight:600;margin-bottom:8px;white-space:pre-wrap">${esc(q.q)}</div><div class="small" style="color:var(--ok);white-space:pre-wrap"><b>Answer:</b> ${esc(answerText(q))}</div><div class="small" style="margin-top:6px">${fmtExp(q.e)}</div></div>`}).join("");
  sess.tick=null;const missedCopy=missed.slice();sess=null;
  app.innerHTML=`
  <div class="card" style="text-align:center">
    <div class="sub">${isExam?"Exam Simulator result":"Session complete"}</div>
    <div class="big">${pct}%</div>
    <div>${correct} of ${total} correct</div>
    ${isExam?`<div class="passbadge ${pass?"pb-pass":"pb-fail"}">${pass?"PASS — at or above the 70% mark 🎉":"Below 70% — keep drilling"}</div>`:""}
    <div class="rowbtns" style="justify-content:center;margin-top:10px">
      ${missedCopy.length?`<button class="btn" onclick='retry(${JSON.stringify(missedCopy)})'>Retry the ${missedCopy.length} missed</button>`:""}
      <button class="btn ghost" onclick="goHome()">Home</button>
    </div>
  </div>
  ${Object.keys(perTopic).length>1?`<div class="card"><h2>By topic</h2>${topicHtml}</div>`:""}
  ${missedCopy.length?`<h2 style="margin:18px 4px 6px">Review your misses</h2>${missedHtml}`:""}`;
  window.scrollTo(0,0);
}
let bFilter="All",bSearch="";
function browse(t){
  if(sess&&sess.tick)clearInterval(sess.tick);sess=null;
  bFilter=t||"All";bSearch="";
  renderBrowse();
}
function renderBrowse(){
  const chips=["All",...TOPICS].map(t=>`<span class="chip ${bFilter===t?"on":""}" onclick="bFilter='${esc(t)}';renderBrowse()">${esc(t)}</span>`).join("");
  const pool=QUESTIONS.filter(q=>(bFilter==="All"||q.t===bFilter)&&(!bSearch||(q.q+" "+(q.o||[]).join(" ")+" "+q.e).toLowerCase().includes(bSearch)));
  const cards=pool.map(q=>{
    const s=S.stats[q.n];const col=!s||!s.seen?"var(--mut)":s.box>=3?"var(--ok)":s.box>=2?"var(--warn)":"var(--bad)";
    return`<div class="card bcard" onclick="const r=this.querySelector('.rev');r.style.display=r.style.display==='block'?'none':'block'">
      <div class="qmeta"><span class="dot" style="background:${col}"></span><span class="tag">Q${q.n}</span><span class="tag">${esc(q.t)}</span></div>
      <div style="font-weight:600;white-space:pre-wrap">${esc(q.q)}</div>
      <div class="rev" style="display:none"><div class="a" style="white-space:pre-wrap">✔ ${esc(answerText(q))}</div><div class="small" style="margin-top:6px">${fmtExp(q.e)}</div></div>
    </div>`;
  }).join("");
  app.innerHTML=`
  <div class="card">
    <div class="qmeta"><h2 style="margin:0">Browse & Cram</h2><span style="flex:1"></span><span class="tag" style="cursor:pointer" onclick="goHome()">← Home</span></div>
    <div class="sub">Tap a card to reveal the answer. Dot: grey = unseen, red = struggling, amber = learning, green = mastered.</div>
    <input class="search" placeholder="Search questions… (e.g. reconcile, PSMConnect, padr.ini)" value="${esc(bSearch)}" oninput="bSearch=this.value.toLowerCase();clearTimeout(window._bt);window._bt=setTimeout(()=>{renderBrowse();const s=document.querySelector('.search');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250)">
    <div class="chips">${chips}</div>
    <div class="small">${pool.length} question${pool.length===1?"":"s"}</div>
  </div>${cards}`;
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!sess)return;
  if(e.key>="1"&&e.key<="9"){const q=sess.qs[sess.i];if((q.y==="mc"||q.y==="multi")&&!sess.answered){const i=+e.key-1;if(i<q.o.length)pickOpt(i)}}
  if(e.key==="Enter"){const b=document.getElementById("submitBtn");if(b&&!b.disabled){e.preventDefault();b.click()}}
});
/* ---- optional sign-in & cross-device progress sync (Puter.js) ----
   Loads the Puter SDK at runtime; if it can't load (offline, blocked),
   the button stays hidden and the app runs local-only. */
const KVKEY="pamdef_stats_v1";
let user=null,puterReady=false,pushT=null;
function loadPuter(){
  return new Promise(res=>{
    if(window.puter){res(true);return}
    const s=document.createElement("script");
    s.src="https://js.puter.com/v2/";
    s.onload=()=>res(!!window.puter);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(!!window.puter),9000);
  });
}
async function initAuth(){
  puterReady=await loadPuter();
  if(!puterReady)return;
  const btn=document.getElementById("acctBtn");
  if(btn)btn.style.display="";
  try{
    if(puter.auth.isSignedIn()){
      user=await puter.auth.getUser();
      await pullCloud();
      if(!sess)home();
    }
  }catch(e){}
  renderAcct();
}
async function acctClick(){
  if(!puterReady)return;
  if(user){
    if(confirm("Sign out? Your progress stays saved in your account and on this device.")){
      try{puter.auth.signOut()}catch(e){}
      user=null;renderAcct();
    }
    return;
  }
  try{
    await puter.auth.signIn();
    user=await puter.auth.getUser();
    await pullCloud();
    renderAcct();
    if(!sess)home();
  }catch(e){/* popup closed */}
}
function renderAcct(){
  const btn=document.getElementById("acctBtn");
  if(!btn)return;
  btn.classList.toggle("on",!!user);
  btn.textContent=user?"☁ "+user.username:"Sign in to sync";
  btn.title=user?"Progress is syncing to your account. Click to sign out.":"Sign in (free) to keep your progress across devices";
}
async function pullCloud(){
  try{
    const raw=await puter.kv.get(KVKEY);
    if(raw){
      const remote=typeof raw==="string"?JSON.parse(raw):raw;
      for(const n in remote){
        const r=remote[n],l=S.stats[n];
        if(r&&r.seen&&(!l||r.seen>l.seen))S.stats[n]=r;
      }
      save();
    }
  }catch(e){}
  pushCloud(0);
}
function pushCloud(delay){
  if(!user||!puterReady)return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{try{puter.kv.set(KVKEY,JSON.stringify(S.stats))}catch(e){}},delay===0?0:1500);
}
home();
initAuth();
</script>
