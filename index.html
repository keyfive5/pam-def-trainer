{n:166,t:T.U,y:"mc",q:"All auditors are missing the 'Audit Users' Vault permission. Where do you update this permission for all auditors?",o:["PrivateArk Client > Tools > Administrative Tools > Directory Mapping > Vault Authorizations","PrivateArk Client > Tools > Administrative Tools > Users and Groups > Auditors > Authorizations tab","PVWA User Provisioning > LDAP integration > Vault Auditors Mapping > Vault Authorizations","PVWA > Administration > Configuration Options > LDAP integration > Vault Auditors Mapping"],a:[1],e:"PrivateArk Client → Users and Groups → Auditors group → Authorizations tab → grant Audit Users."},
{n:167,t:T.U,y:"mc",q:"A new domain controller has been added to your domain. Which locations must you update so CyberArk can use it for authentication?",o:["On the Vault server in Windows\\System32\\Etc\\Hosts AND in PVWA under Administration > LDAP Integration > Directories > Hosts","Hosts file on the Vault server AND hosts file on the PVWA server","PrivateArk client under Tools > Administrative Tools > Directory Mapping","Certificate stores on the Vault and PVWA servers"],a:[0],e:"Add the DC to the Vault's hosts file + the PVWA's LDAP Integration → Directories → Hosts list."},
{n:168,t:T.O,y:"mc",q:"Which statement is correct concerning accounts that are discovered but cannot be added to the Vault by an automated onboarding rule?",o:["They are added to the Pending Accounts list and can be reviewed and manually uploaded","They cannot be onboarded to the Password Vault","They must be uploaded using third-party tools","They are not part of the Discovery process"],a:[0],e:"No matching rule → Pending Accounts list → manual review/onboarding."},
{n:169,t:T.P,y:"mc",q:"Which item is an option for PSM recording customization?",o:["Windows events text recorder with automatic play-back","Windows events text recorder and universal keystrokes recording simultaneously","Universal keystrokes text recorder with Windows events text recorder disabled","Custom audio recording for Windows events"],a:[2],e:"Universal keystrokes and Windows-events recorders can't run together on the same PSM-RDP connection — disable Windows events to enable universal keystrokes."},
{n:170,t:T.A,y:"match",q:"Match each PTA alert category with the sensors that collect its data.",p:[["Unmanaged privileged account","Network Sensor, PTA Windows Agent"],["Anomalous access to multiple machines","Logs, Vault (optionally AWS/Azure)"],["Suspicious activities in a privileged session","Logs, Vault (optionally AD/AWS/Azure)"],["Suspected credentials theft","Network Sensor, PTA Windows Agent"]],a:[],e:"Network-borne detections (unmanaged account, credential theft) come from the Network Sensor / Windows Agent; behavioral ones from Logs + Vault (+cloud/AD)."},
{n:171,t:T.V,y:"mc",q:"ACME Corp wants to store the Safes Data on Drive D instead of Drive C. Which file should you edit?",o:["TSparm.ini","Vault.ini","DBparm.ini","user.ini"],a:[0],e:"TSParm.ini holds the Safes data location (SafesDirectory) — edit it to move storage to another drive."},
{n:172,t:T.U,y:"mc",q:"Which option in the PrivateArk client is used to update users' Vault group memberships?",o:["Update > General tab","Update > Authorizations tab","Update > Member Of tab","Update > Group tab"],a:[2],e:"Member Of tab manages the groups a user belongs to."},
{n:173,t:T.O,y:"multi",q:"Which of the following properties are MANDATORY when adding accounts from a file? (Choose three)",o:["Safe Name","Platform ID","All required properties specified in the Platform","Username","Address","Hostname"],a:[0,1,2],e:"Safe Name (where it's stored) + Platform ID (policy applied) + whatever properties that platform marks required."},
{n:174,t:T.A,y:"mc",q:"Which Automatic Remediation is configurable for a PTA detection of 'Suspected Credential Theft'?",o:["Add to Pending","Rotate Credentials","Reconcile Credentials","Disable Account"],a:[1],e:"Suspected credential theft → Rotate Credentials (auto password change). Unmanaged account → Add to Pending; suspicious password change → Reconcile (see Q232)."},
{n:175,t:T.P,y:"multi",q:"Users are unable to launch Web Type Connection components from the PSM server. Which logs will help CyberArk Support debug the issue? (Choose three)",o:["PSMConsole.log","PSMDebug.log","PSMTrace.log","<Session_ID>.Component.log","PMconsole.log","ITAlog.log"],a:[0,2,3],e:"PSMConsole.log (PSM function errors), PSMTrace.log (trace messages), <SessionID>.Component.log (per-connection-component errors)."},
{n:176,t:T.D,y:"multi",q:"You notice an authentication failure entry for the DR user in the ITALog. What is the correct process to fix this error? (Choose two)",o:["PrivateArk Client > Users and Groups > DR User > Update > Authentication > Update Password","Create a new credential file on the DR Vault using CreateCredFile with the newly set password","Create a new credential file on the PRIMARY Vault using CreateCredFile","PVWA > User Provisioning > Users and Groups > DR User > Update Password","PrivateArk Client > PAReplicate User > Update Password"],a:[0,1],e:"Reset the DR user's password in PrivateArk, then regenerate the credential file ON THE DR VAULT with CreateCredFile."},
{n:177,t:T.D,y:"mc",q:"How do you create a cold storage backup?",o:["On the DR Vault, install PAReplicate per the Installation guide, configure the logon ini file, and define scheduled tasks for full and incremental backups","Install the Vault Backup utility on a different machine from the EPV server and trigger the full backup","Configure the backup options in the PVWA","On the DR Vault, configure the cold storage backup path in TSParm.ini"],a:[0],e:"PAReplicate on the DR Vault + logon ini + scheduled full/incremental backups = cold storage backup."},
{n:178,t:T.U,y:"multi",q:"Which methods can you use to add a user directly to the Vault Admin group? (Choose three)",o:["REST API","PrivateArk Client","PACLI","PVWA","Active Directory","Sailpoint"],a:[0,1,2],e:"REST API, PrivateArk Client, and PACLI can add users directly to the Vault Admins group."},
{n:179,t:T.U,y:"mc",q:"User EMEALevel2Support has rights: Add/Update Users, Manage Server File Categories, Manage Directory Mapping, Backup All Files, Restore All Files. Why can't they change the password for user 'Operator'?",o:["EMEALevel2Support's hierarchy level is not the same or higher than Operator","EMEALevel2Support lacks the 'Manage Directory Mapping' role","Operator can only be reset by the Master user","EMEALevel2Support does not have rights to reset passwords for other users"],a:[3],e:"None of the listed authorizations includes resetting other users' passwords — the reset-password right is missing."},
{n:180,t:T.M,y:"multi",q:"Which processes reduce the risk of credential theft? (Choose two)",o:["Require dual control password access approval","Require password change every X days","Enforce check-in/check-out exclusive access","Enforce one-time password access"],a:[1,3],e:"Regular rotation + one-time passwords shrink the window a stolen credential is useful. (Dual control = collusion; exclusive = accountability.)"},
{n:181,t:T.C,y:"mc",q:"When an account is unable to change its own password, how can you ensure that password RESET with the reconcile account is performed each time instead of a change?",o:["Set RCAllowManualReconciliation to Yes","Set ChangePasswordinResetMode to Yes","Set IgnoreReconcileOnMissingAccount to No","Set UnlockUserOnReconcile to Yes"],a:[2],e:"Keyed: IgnoreReconcileOnMissingAccount = No — the reconcile account (which CAN reset others' passwords) is used each time."},
{n:182,t:T.R,y:"multi",q:"Which Vault authorizations does a user need to generate the Entitlement Report from the PVWA Reports page? (Choose two)",o:["Manage Users","Audit Users","Read Activity","View Entitlements","List Accounts"],a:[1,3],e:"Keyed: Audit Users + View Entitlements."},
{n:183,t:T.P,y:"order",q:"From the PVWA, arrange the steps to configure a PSM host to use a new HTML5 Gateway in the correct sequence.",o:["Log in to the PVWA with an administrative user","Navigate to Administration > Options","Right-click Privileged Session Management, then select Add Configured PSM Gateway Servers","Right-click Configured PSM Gateway Servers, then Add PSM Gateway Server","Enter a unique ID for the PSM HTML5 Gateway server","Expand the newly created gateway server and enter the configuration details"],a:[],e:"PVWA admin login → Options → add the Configured PSM Gateway Servers section → add a gateway server → unique ID → fill in details."},
{n:184,t:T.U,y:"mc",q:"What do you need ON THE VAULT to support LDAP over SSL?",o:["CA Certificate(s) used to sign the External Directory certificate","RECPRV.key","A private key for the external directory","Self-signed certificate(s) for the Vault"],a:[0],e:"Import the signing CA cert(s) into the Vault's Windows certificate store to trust the LDAPS connection."},
{n:185,t:T.S,y:"mc",q:"In addition to 'add accounts' and 'update account contents', which additional safe permission is required to add a single account?",o:["Upload Accounts Properties","Rename Accounts","Update Account Properties","Manage Safe"],a:[2],e:"Adding a single account also needs Update Account Properties (to set the account's properties)."},
{n:186,t:T.P,y:"mc",q:"Due to storage constraints, you must disable session monitoring and recording for 500 test accounts. How do you accomplish this?",o:["Master Policy > Session Management > add Exceptions to the platform(s) > disable Session Monitoring and Recording policies","Administration > Platform Management > select the platform(s) > disable Session Monitoring and Recording","Policies > Access Control (Safes) > select the safe(s) > disable policies","Administration > Configuration Options > Options > Privilege Session Management > disable policies"],a:[1],e:"✎ Corrected to Platform Management. Session monitoring and recording are disabled per PLATFORM: Administration → Platform Management → select the platform(s) → Edit → UI & Workflows → Privileged Session Management (Add Override Live Sessions Monitoring Settings / Recorder Settings → Enabled = No). Attach the 500 lab accounts to that platform and recording stops for them only. It is never configured per-safe.",r:["CyberArk Docs — Configure video and text recordings (per-platform)","https://docs.cyberark.com/pam-self-hosted/latest/en/content/pasimp/configure-recordings-in-psm.htm"]},
{n:187,t:T.C,y:"mc",q:"What does the MinValidity parameter on a platform policy determine?",o:["Time between a password retrieval and the account becoming eligible for a password change","Timeout for users signed into the PVWA per global settings","Minimum amount of time that Just-in-Time access is valid","Time in minutes before an empty safe is automatically deleted"],a:[0],e:"MinValidity = guaranteed usable window after retrieval before the CPM may change the password (also releases exclusive accounts)."},
{n:188,t:T.O,y:"multi",q:"Which accounts can be selected for use in the Windows discovery process? (Choose two)",o:["An account stored in the Vault","An account specified by the user","The Vault Administrator","Any user with Auditor membership","The PasswordManager user"],a:[0,1],e:"Discovery can run with a vaulted account OR manually specified credentials."},
{n:189,t:T.C,y:"mc",q:"What is required to manage loosely connected devices?",o:["PSM for SSH","EPM","PSM","PTA"],a:[1],e:"Endpoint Privilege Manager (EPM) rotates credentials on Windows/macOS devices that aren't always on the enterprise network."},
{n:190,t:T.C,y:"multi",q:"Where can reconcile and/or logon accounts be linked to an account? (Choose two)",o:["Account settings","Platform settings","Master policy","Safe settings","Service account settings"],a:[1,3],e:"⚠ Keyed: platform + safe settings. But Q211 (and docs) say ACCOUNT level + PLATFORM level. Know both keyed answers; conceptually: linked accounts are set on the account or via platform parameters."},
{n:191,t:T.P,y:"mc",q:"You want to build a connector that connects to a website through the Web applications for PSM framework. Which default connector do you duplicate and modify?",o:["PSM-ChromeSample","PSM-WebForm","PSM-WebApp","PSM-WebAppSample"],a:[3],e:"Duplicate PSM-WebAppSample — the sample template for web application connectors."},
{n:192,t:T.U,y:"mc",q:"A colleague created a directory mapping between AD groups and the Vault. Where can the newly configured directory mapping be tested?",o:["Connect to Active Directory and ensure the organizational unit exists","Check Sailpoint naming, then log into PVWA as 'Administrator'","Search for members that exist only in the mapping group to grant them safe permissions through the PVWA","Connect to PrivateArk as Administrator and look for a user in the Vault Admin group"],a:[2],e:"Search in PVWA for members that only exist in the mapped group — if they resolve, the mapping works."},
{n:193,t:T.V,y:"multi",q:"You are troubleshooting a PVWA slow response. Which log files should you analyze first? (Choose two)",o:["ITALog.log","web.config","CyberArk.WebApplication.log","CyberArk.WebConsole.log"],a:[2,3],e:"CyberArk.WebApplication.log + CyberArk.WebConsole.log on the PVWA web server (location set by LogFolder in web.config)."},
{n:194,t:T.V,y:"multi",q:"During an HA node switch you notice an error and the Cluster Vault Manager fails back to the original node. Which logs should you check? (Choose three)",o:["CyberArk Webconsole.log","VaultDB.log","PM_Error.log","ITALog.log","ClusterVault.console.log","logiccontainer.log"],a:[1,2,4],e:"VaultDB.log (database ops), PM_Error.log (password manager errors), ClusterVault.console.log (cluster errors/warnings)."},
{n:195,t:T.O,y:"multi",q:"What must you specify when configuring a discovery scan for UNIX? (Choose two)",o:["Vault Administrator","CPM Scanner","Root password for each machine","List of machines to scan","Safe for discovered accounts"],a:[1,3],e:"UNIX discovery needs the CPM Scanner + a list (CSV) of machines to scan."},
{n:196,t:T.O,y:"mc",q:"You want to create a new onboarding rule. Where do you accomplish this?",o:["PVWA > Reports > Unmanaged Accounts > Rules","PVWA > Options > Platform Management > Onboarding Rules","PrivateArk > Tools > Onboarding Rules","PVWA > Accounts > Onboarding Rules"],a:[3],e:"PVWA → Accounts → Onboarding Rules → Create rule (wizard)."},
{n:197,t:T.S,y:"multi",q:"You created a new safe and need to ensure the user group cannot see the password but CAN connect through the PSM. Which safe permissions must you grant the group? (Choose two)",o:["List Accounts","Use Accounts","Access Safe without Confirmation","Retrieve Files","Confirm Request"],a:[0,1],e:"✎ Corrected to List Accounts + Use Accounts. 'Use Accounts' lets them click Connect through the PSM; 'List Accounts' lets them see the account in the list. You deliberately withhold Retrieve — that is exactly the permission that reveals/copies the password. Same logic as Q92.",r:["CyberArk Docs — Safe member permissions","https://docs.cyberark.com/pam-self-hosted/latest/en/content/pasimp/safes-concept.htm"]},
{n:198,t:T.P,y:"mc",q:"To change the safe where recordings are kept for a specific platform, which setting must you update in the platform configuration?",o:["SessionRecorderSafe","SessionSafe","RecordingsPath","RecordingLocation"],a:[0],e:"SessionRecorderSafe = the safe storing PSM recordings for that platform (restart PSM / wait ~10 min to apply)."},
{n:199,t:T.A,y:"mc",q:"If PTA is integrated with a supported SIEM solution, which detection becomes available?",o:["Unmanaged privileged account","Privileged access to the Vault during irregular days","RiskySPN","Exposed credentials"],a:[3],e:"SIEM integration enables 'exposed credentials' detection — connecting with a privileged account without first retrieving it from the Vault."},
{n:200,t:T.U,y:"mc",q:"When are external vault users and groups synchronized by default?",o:["Once every 24 hours between 1 AM and 5 AM","Once every 24 hours between 7 PM and 12 AM","Every 2 hours","They are not synchronized according to a specific schedule"],a:[0],e:"AutoSyncExternalObjects (DBParm.ini): daily sync with the external directory between 01:00–05:00."},
{n:201,t:T.R,y:"mc",q:"What does the Export Vault Data (EVD) utility do?",o:["Exports data from the Vault to TXT or CSV files, or to MSSQL databases","Generates a backup file that can be used as a cold backup","Exports all passwords and imports them into another instance of CyberArk","Keeps two active vaults in sync"],a:[0],e:"EVD exports Vault data (safes list, requests, etc.) to TXT/CSV or MSSQL for third-party reporting."},
{n:202,t:T.C,y:"mc",q:"You are concerned about Windows domain password changes occurring during business hours. Which settings must be updated to ensure passwords are only rotated outside business hours?",o:["Platform policy > Automatic Password Management > Password Change > ToHour & FromHour","Master Policy > Account Change Window > ToHour & FromHour","Administration Settings > CPM Settings > ToHour & FromHour","On each individual account > Edit > Advanced > ToHour & FromHour"],a:[1],e:"⚠ Keyed B (Master Policy Account Change Window) here, but Q228 keys the PLATFORM's FromHour/ToHour for the same requirement — the platform-level answer is what docs support. Know both."},
{n:203,t:T.O,y:"multi",q:"What are the mandatory fields when onboarding from Pending Accounts? (Choose two)",o:["Address","Safe","Account Description","Platform","CPM"],a:[1,3],e:"Safe (where it's stored) + Platform (policies applied) are mandatory."},
{n:204,t:T.D,y:"mc",q:"Before failing back to production after a DR exercise, what must you do to maintain audit history from the DR event?",o:["Ensure the Production instance replicates changes that occurred on the Disaster Recovery instance","Briefly stop and start the DR instance before failing components back","Stop the CPM services before starting the production server","Perform an IIS reset on all PVWA servers"],a:[0],e:"Replicate DR → Production first, so audit records and changes made during the DR event aren't lost."},
{n:205,t:T.P,y:"multi",q:"A user needs to view recorded sessions through the PVWA WITHOUT auditor access. Which safes does the user need access to? (Choose two)",o:["Recordings safe","Safe the account is in","System safe","PVWAConfiguration safe","VaultInternal safe"],a:[0,1],e:"Access to the Recordings safe (where recordings are stored) + the safe holding the account."},
{n:206,t:T.O,y:"multi",q:"What are the minimum permissions to add multiple accounts from a file when using PVWA bulk-upload? (Choose three)",o:["Add accounts","Rename accounts","Update account content","Update account properties","View safe members","Add safes"],a:[0,2,3],e:"Bulk upload needs: Add accounts + Update account content + Update account properties."},
{n:207,t:T.S,y:"multi",q:"Which authorizations are REQUIRED in a recording safe to allow a group to view recordings? (Select all that are required)",o:["Retrieve accounts/files","List accounts/files","View audit","Access Safe without confirmation","Create folders"],a:[0,1,2],e:"Required: Retrieve + List + View Audit. NOT required: Access Safe without confirmation, Create folders."},
{n:208,t:T.U,y:"mc",q:"Where can you check that the LDAP binding is using TCP/636?",o:["Active Directory > Users OU > User Properties > External Bindings > Port","PVWA > LDAP Integration > LDAP > Directories > Hosts > Host","PrivateArk Client > Tools > Administrative Tools > Directory Mapping","From the PVWA, connect to the domain controller using Test-NetConnection on port 636"],a:[3],e:"Test-NetConnection <DC> -Port 636 verifies the secure LDAPS port is listening/reachable."},
{n:209,t:T.V,y:"mc",q:"What can you do to ensure each component server is operational?",o:["Log on to PVWA (v10 UI), navigate to System Health, and validate each component server is connected to the Vault","Ping each component server","Use the PrivateArk client to connect to the Vault and validate all services are running","Install the Vault Server interface on a remote machine and review ITALog.log"],a:[0],e:"The PVWA System Health dashboard shows each component's connection status to the Vault."},
{n:210,t:T.C,y:"mc",q:"What is the correct process to install a custom platform from the CyberArk Marketplace?",o:["Locate the custom platform in the Marketplace and click Import","Download the platform from the Marketplace and import it using the PVWA","Contact CyberArk Support for guidance","Duplicate an existing platform and align its settings to the Marketplace platform"],a:[1],e:"Download the platform package from the Marketplace → import via PVWA (Platform Management)."},
{n:211,t:T.C,y:"multi",q:"Where can you assign a Reconcile account? (Choose two)",o:["In PVWA at the account level","In PVWA in the platform configuration","In the Master Policy of the PVWA","At the Safe level","In the CPM settings"],a:[0,1],e:"Account level (overrides platform) or platform level (ReconcileAccountSafe / ReconcileAccountName). Never in Master Policy. Compare Q190's keyed answer."},
{n:212,t:T.S,y:"mc",q:"When you try to create an account group you get an unauthorized error, though you can edit other account properties. Which safe permission do you need to manage account groups?",o:["Create folders","Specify next account content","Rename accounts","Manage safe"],a:[3],e:"Manage Safe is required to create/update/delete account groups in a safe."},
{n:213,t:T.P,y:"mc",q:"You are configuring CyberArk to use HTML5 gateways exclusively for PSM connections. In the PVWA, where do you set DefaultConnectionMethod to HTML5?",o:["Options > Privileged Session Management UI","Options > Privileged Session Management","Options > Privileged Session Management Defaults","Options > Privileged Session Management Interface"],a:[0],e:"Administration > Options > Privileged Session Management UI → DefaultConnectionMethod = HTML5."},
{n:214,t:T.C,y:"mc",q:"Which statement is TRUE about setting the reconcile account at the platform level?",o:["It is the only way to enable automatic reconciliation of account passwords","CPM performance improves when the reconcile account is set at platform level","A rule can be used to specify the reconcile account dynamically, or a specific reconcile account can be selected","This configuration prevents the association from breaking if the reconcile account moves to a different safe"],a:[2],e:"Platform-level reconcile supports a dynamic rule OR a specific selected account."},
{n:215,t:T.R,y:"multi",q:"Where can a user with the appropriate permissions generate a report? (Choose two)",o:["PVWA > Reports","PrivateArk Client","Cluster Vault Manager","PrivateArk Server Monitor","PARClient"],a:[0,1],e:"Reports come from the PVWA Reports page and the PrivateArk Client."},
{n:216,t:T.U,y:"mc",q:"In the PrivateArk client (Tools > Administrative Tools > Users and Groups), which option do you use to update users' Vault group memberships?",o:["Update > General tab","Update > Authorizations tab","Update > Member Of tab","Update > Group tab"],a:[2],e:"Member Of tab = group memberships (Authorizations tab = vault authorizations)."},
{n:217,t:T.D,y:"order",q:"A DR Vault became active due to a Primary failure. Service on the Primary is restored. Arrange the steps to return the DR Vault to normal standby mode.",o:["Shut down the PrivateArk Server service on the DR Vault","In PADR.ini, set FailoverMode=No and remove the last two lines","Start the PrivateArk Disaster Recovery service"],a:[],e:"Stop PrivateArk Server on DR → edit PADR.ini (FailoverMode=No, delete last two lines) → start the DR service (back to replication)."},
{n:218,t:T.A,y:"mc",q:"You want to give a newly created group rights to review security events under the Security pane AND update the status of these events. Where must you update the group?",o:["PTAAuthorizationGroups parameter — Administration > Options > PTA","PTAAuthorizationGroups parameter — Administration > Options > General","SecurityEventsAuthorizationGroups — Administration > Security > Options","SecurityEventsFeedAuthorizationGroups — Administration > Options > General"],a:[3],e:"SecurityEventsFeedAuthorizationGroups under Administration > Options > General controls who can view/update security events."},
{n:219,t:T.M,y:"mc",q:"A password compliance audit found: (1) one-time password access of 20 Domain Admin accounts is not enforced; (2) sessions to domain controllers are not recorded by PSM. What should you do?",o:["Edit the Master Policy and add two policy exceptions: enable 'Enforce one-time password access' and 'Record and save session activity'","Edit safe properties and add two policy exceptions","Edit CPM Settings and add two policy exceptions","Ask Windows admins to add two policy exceptions at Active Directory level"],a:[0],e:"Both OTP enforcement and session recording are Master Policy rules — add exceptions there (scoped by platform)."},
{n:220,t:T.C,y:"multi",q:"Which dependent accounts does the CPM support out-of-the-box? (Choose three)",o:["Solaris Configuration file","Windows Services","Windows Scheduled Tasks","Windows DCOM Applications","Windows Registry","Key Tab file"],a:[1,2,4],e:"OOTB dependents: Windows Services, Scheduled Tasks, Registry — CPM syncs their passwords with the master account."},
{n:221,t:T.V,y:"multi",q:"According to CyberArk, which issues most commonly cause installed components to display as disconnected in the System Health Dashboard? (Choose two)",o:["Network instabilities/outages","Vault license expiry","Credential de-sync","Browser compatibility issues","Installed location file corruption"],a:[0,2],e:"Disconnected components = network issues or credential de-sync (component can no longer authenticate to the Vault)."},
{n:222,t:T.A,y:"mc",q:"Which file must be edited on the Vault to configure it to send data to PTA?",o:["dbparm.ini","PARAgent.ini","my.ini","padr.ini"],a:[0],e:"dbparm.ini holds the syslog-forwarding parameters that send Vault events to PTA."},
{n:223,t:T.V,y:"mc",q:"When should vault keys be rotated?",o:["When a key is copied to file systems outside the vault","Annually","Whenever a CyberArk user leaves the organization","When migrating to a new data center"],a:[3],e:"Keyed: when migrating to a new data center (keys potentially exposed to new environments). Also rotate whenever exposure is suspected."},
{n:224,t:T.P,y:"mc",q:"What is required to enable access over SSH to a Unix account through BOTH PSM and PSMP?",o:["The platform must contain connection components for both PSM-SSH and PSMP-SSH","PSM and PSMP must already have stored the SSH fingerprint for the Unix host","The 'Enable PSMP' setting in the Unix platform must be set to Yes","A duplicate platform with the PSMP settings must be created"],a:[0],e:"The platform needs BOTH connection components: PSM-SSH and PSMP-SSH."},
{n:225,t:T.M,y:"mc",q:"Which statement best describes the difference between one-time password and exclusive access functionality in the Master Policy?",o:["Exclusive access means only a specific group may use the account; after one use the account is deleted from the safe","Exclusive access locks the account indefinitely; OTP replaces invalid passwords","Exclusive access is enabled by default; OTP is for emergencies only","Exclusive access allows only one person to check out an account at a time; OTP schedules a password change after MinValidityPeriod expires"],a:[3],e:"Exclusive = one checkout at a time (locked until check-in). OTP = CPM changes the password after use, once MinValidityPeriod passes."},
{n:226,t:T.P,y:"multi",q:"Five new local accounts for standalone Windows servers were onboarded, but the Connect button is greyed out for all of them. What should you verify? (Choose three)",o:["The address field is populated with an IP or FQDN of each server","The correct PSM connection component appears within the account platform settings","The address field is blank and the correct PSM connection component is set","Notify the Windows team that CyberArk can't manage local accounts","'Disable automatic management for this account' is not enabled"],a:[0,1,4],e:"Greyed Connect = check address populated, PSM connection component on the platform, and that auto-management isn't disabled."},
{n:227,t:T.C,y:"mc",q:"When the CPM connects to a database, which interface is most commonly used?",o:["Kerberos","ODBC","VBScript","Sybase"],a:[1],e:"ODBC — CPM manages any database supporting ODBC connections (v2.7+ on the CPM machine)."},
{n:228,t:T.C,y:"mc",q:"Certain accounts cannot have their passwords updated during business hours. How do you configure this?",o:["Change settings on the CPM configuration safe so access is permitted after business hours only","Update the password change parameters of the platform to match the permitted time frame","Disable automatic CPM management for all accounts on this platform","Add an exception to the Master Policy to allow the action during the permitted time"],a:[1],e:"Platform-level password-change FromHour/ToHour restricts when the CPM rotates passwords. (Compare Q202's keyed Master Policy answer.)"},
{n:229,t:T.M,y:"mc",q:"Which Master Policy settings ensure non-repudiation?",o:["Require password verification every X days and enforce one-time password access","Enforce check-in/check-out exclusive access and enforce one-time password access","Allow EPV transparent connections and enforce check-in/check-out exclusive access","Allow EPV transparent connections and enforce one-time password access"],a:[1],e:"Exclusive check-in/check-out (one user at a time, traceable) + OTP (no credential reuse) = non-repudiation."},
{n:230,t:T.U,y:"order",q:"Delegate the rights to unlock users to Tier 1 support (which already has an LDAP group). Arrange the steps in the correct sequence.",o:["Sign in to the PVWA as a local user with the 'Manage Directory Mapping' privilege","Open the LDAP Integration view","Add a Mapping to the existing LDAP integration","Name the new mapping and set the mapping order","Select the required LDAP group and assign the 'Activate Users' authorization"],a:[],e:"PVWA (Manage Directory Mapping) → LDAP Integration → Add Mapping → name + order → assign 'Activate Users' to the LDAP group."},
{n:231,t:T.S,y:"mc",q:"You have been asked to turn off the time access restrictions for a safe. Where is this setting found?",o:["PrivateArk Client","RestAPI","PVWA","Vault"],a:[0],e:"PrivateArk Client. A safe's access hours live on the Restrictions tab of Safe Properties in the PrivateArk Client — set it to 'All Hours' to turn the restriction off. Same answer as Q121. ✎ Corrected from PVWA.",r:["CyberArk Docs — Manage Safes in PrivateArk (Safe Properties → Restrictions)","https://docs.cyberark.com/pam-self-hosted/latest/en/content/pasimp/safes-privateark-management.htm"]},
{n:232,t:T.A,y:"match",q:"Match each automatic remediation to the correct PTA security event.",p:[["Add To Pending","Unmanaged privileged account"],["Rotate Credentials","Suspected credentials theft"],["Reconcile Credentials","Suspicious password change"]],a:[],e:"Unmanaged account → Add to Pending; credential theft → Rotate; suspicious password change → Reconcile."},
{n:233,t:T.V,y:"mc",q:"You are configuring a Vault HA cluster. Which file should you check to confirm the correct drives have been assigned for the Quorum and Safes data disks?",o:["ClusterVault.ini","my.ini","vault.ini","DBParm.ini"],a:[0],e:"ClusterVault.ini holds the HA cluster configuration, including Quorum and Safes data drive assignments."},

  // otherwise    => the distractors are alternative PREDICATES for the subject
  const topic=f[0],subject=f[1],truth=f[2],wrongs=f[3],subj=f[4]==="subj";
  const ref=REFT[topic]||null;
  const style=styleHint!==undefined?styleHint:Math.floor(Math.random()*2);
  if(style===0){
    // multiple choice
    if(subj){
      // options are proper names (files, users, groups) — keep their exact casing
      const opts=shuffle([subject,...shuffle(wrongs).slice(0,3)]);
      return {n:"G"+(GID++),t:topic,y:"mc",gen:true,
        q:"Which of the following "+truth+"?",
        o:opts.slice(),a:[opts.indexOf(subject)],
        e:cap(subject)+" "+truth+".",r:ref};
    }
    const opts=shuffle([truth,...shuffle(wrongs).slice(0,3)]);
    return {n:"G"+(GID++),t:topic,y:"mc",gen:true,
      q:"Which statement about "+subject+" is correct?",
      o:opts.map(cap),a:[opts.indexOf(truth)],
      e:cap(subject)+" "+truth+".",r:ref};
  }
  // true / false — half the time we assert something false
  const useTruth=Math.random()<0.5;
  if(subj){
    const who=useTruth?subject:shuffle(wrongs)[0];
    return {n:"G"+(GID++),t:topic,y:"mc",gen:true,
      q:cap(who)+" "+truth+".",o:["TRUE","FALSE"],a:[useTruth?0:1],
      e:useTruth?("Correct — "+cap(subject)+" "+truth+"."):("False. It is "+subject+" that "+truth+"."),r:ref};
  }
  const claim=useTruth?truth:shuffle(wrongs)[0];
  return {n:"G"+(GID++),t:topic,y:"mc",gen:true,
    q:cap(subject)+" "+claim+".",o:["TRUE","FALSE"],a:[useTruth?0:1],
    e:useTruth?("Correct — "+cap(subject)+" "+truth+"."):("False — "+subject+" actually "+truth+"."),r:ref};
}
function buildGeneratedExam(count){
  GID=1;
  const out=[];
  // one pass over every fact (shuffled), then top up with fresh variants
  for(const f of shuffle(FACTS)){
    if(out.length>=count)break;
    out.push(genOne(f));
  }
  while(out.length<count){
    const f=FACTS[Math.floor(Math.random()*FACTS.length)];
    out.push(genOne(f));
  }
  return shuffle(out).slice(0,count);
}

function lPickOpt(i){

  document.getElementById('lfb').innerHTML=`<div class="fb ${ok?'good':'badf'}"><div class="verdict ${ok?'g':'b'}">${ok?'✓ '+(s.okw||'Correct'):'✗ Not quite'}</div><div class="exp">${esc(s.e)}</div></div>`;

function lOpenCard(i){
  const el=document.getElementById('dc'+i);
  el.classList.toggle('open');
  LS.opened[i]=true;
  const s=L1STEPS[LS.i];
  const all=s.cards.every((_,k)=>LS.opened[k]);

// ---- drag & drop builder ----
function lRenderDD(){
  const s=L1STEPS[LS.i];
  const slots=document.getElementById('ddslots'),pool=document.getElementById('ddpool');
  slots.innerHTML=s.slots.map((sl,i)=>{
    const v=LS.place[i];
    return `<div class="slot" id="sl${i}" ondragover="lDragOver(event,${i})" ondragleave="lDragLeave(${i})" ondrop="lDrop(event,${i})">
      <div class="sl">${esc(sl.label)}</div>
      <button class="slotbtn ${v?'':'empty'}" onclick="lSlotClick(${i})">${v?esc(v):'drop here'}</button>
    </div>`;
  }).join("");
  pool.innerHTML=LS.pool.map((name,i)=>{
    const used=Object.values(LS.place).includes(name);
    return `<button class="chip2 ${used?'used':''} ${LS.pick===name?'picked':''}" draggable="${!used}" ondragstart="lDragStart(event,'${esc(name)}')" onclick="lPickChip('${esc(name)}')" ${used?'disabled':''}>${esc(name)}</button>`;
  }).join("");
  const filled=Object.keys(LS.place).length===s.slots.length;

function lDragStart(e,name){LS.pick=name;try{e.dataTransfer.setData('text/plain',name);e.dataTransfer.effectAllowed='move';}catch(x){}}
function lDragOver(e,i){if(LS.answered)return;e.preventDefault();const el=document.getElementById('sl'+i);if(el)el.classList.add('over');}
function lDragLeave(i){const el=document.getElementById('sl'+i);if(el)el.classList.remove('over');}
function lDrop(e,i){
  if(LS.answered)return;e.preventDefault();
  let name="";try{name=e.dataTransfer.getData('text/plain');}catch(x){}
  if(!name)name=LS.pick;
  if(!name)return;
  lAssign(i,name);
}
function lPickChip(name){
  if(LS.answered)return;
  if(LS.pick===name){LS.pick=null;lRenderDD();return}
  LS.pick=name;
  // if a slot is empty, hint by just highlighting; user taps slot next
  lRenderDD();
}
function lSlotClick(i){
  if(LS.answered)return;
  if(LS.pick){lAssign(i,LS.pick);return}
  // tapping a filled slot with nothing picked clears it
  if(LS.place[i]){delete LS.place[i];lRenderDD();}
}
function lAssign(i,name){
  // remove this component from any other slot, then place
  Object.keys(LS.place).forEach(k=>{if(LS.place[k]===name)delete LS.place[k]});
  LS.place[i]=name;LS.pick=null;
  lRenderDD();
}
function lCheckDD(){
  const s=L1STEPS[LS.i];
  if(LS.answered||Object.keys(LS.place).length!==s.slots.length)return;
  LS.answered=true;
  let allok=true;
  s.slots.forEach((sl,i)=>{
    const el=document.getElementById('sl'+i);
    const ok=LS.place[i]===sl.answer;
    if(!ok)allok=false;
    el.classList.remove('over');el.classList.add(ok?'ok':'bad');
    el.querySelector('.slotbtn').disabled=true;
  });
  document.querySelectorAll('#ddpool .chip2').forEach(b=>b.disabled=true);
  document.getElementById('lfb').innerHTML=`<div class="fb ${allok?'good':'badf'}"><div class="verdict ${allok?'g':'b'}">${allok?'✓ Architecture built correctly':'Not quite — here it is'}</div>${allok?'':'<div class="small" style="margin-top:6px;line-height:1.8">'+s.slots.map(sl=>esc(sl.label)+' → <b>'+esc(sl.answer)+'</b>').join('<br>')+'</div>'}<div class="exp" style="margin-top:8px">${esc(s.e)}</div></div>`;
  document.getElementById('lfoot').innerHTML=`<button class="btn" onclick="lNext()">Continue →</button>`;
  document.querySelector('#lfoot .btn').focus();
}
function lCheckMatch(){
  const s=L1STEPS[LS.i];if(LS.answered)return;
  for(let i=0;i<s.pairs.length;i++){if(!document.getElementById('lm'+i).value){document.getElementById('lfb').innerHTML='<div class="hint">Choose a job for every component first.</div>';return;}}
  LS.answered=true;let allok=true;
  s.pairs.forEach((p,i)=>{const el=document.getElementById('lm'+i);const ok=el.value===p[1];el.disabled=true;el.classList.add(ok?'ok':'bad');if(!ok)allok=false;});
  document.getElementById('lfb').innerHTML=`<div class="fb ${allok?'good':'badf'}"><div class="verdict ${allok?'g':'b'}">${allok?'✓ All matched':'Here are the correct pairs'}</div><div class="exp">${esc(s.e)}</div>${allok?'':'<div class="small" style="margin-top:8px;line-height:1.7">'+s.pairs.map(p=>'<b>'+esc(p[0])+'</b> → '+esc(p[1])).join('<br>')+'</div>'}</div>`;
  document.getElementById('lfoot').innerHTML=`<button class="btn" onclick="lNext()">Continue →</button>`;
  document.querySelector('#lfoot .btn').focus();

function lRefreshOrder(){
  const s=L1STEPS[LS.i];
  const seq=document.getElementById('lseq'),bank=document.getElementById('lbank');
  seq.innerHTML=LS.seq.length?LS.seq.map((idx,k)=>`<button class="step" onclick="lUnplace(${k})"><span class="num">${k+1}.</span>${esc(s.steps[idx])}</button>`).join(""):'<div class="empty">Your order appears here…</div>';
  bank.innerHTML=LS.disp.filter(i=>!LS.seq.includes(i)).map(i=>`<button class="step" onclick="lPlace(${i})">${esc(s.steps[i])}</button>`).join("");
  const b=document.getElementById('lorderbtn');if(b)b.disabled=LS.answered||LS.seq.length!==s.steps.length;
}
function lPlace(i){if(LS.answered)return;LS.seq.push(i);lRefreshOrder();}
function lUnplace(k){if(LS.answered)return;LS.seq.splice(k,1);lRefreshOrder();}
function lCheckOrder(){
  const s=L1STEPS[LS.i];if(LS.answered||LS.seq.length!==s.steps.length)return;LS.answered=true;
  const ok=LS.seq.every((v,k)=>v===k);

  document.getElementById('lfoot').innerHTML=`<button class="btn" onclick="lNext()">Continue →</button>`;
  document.querySelector('#lfoot .btn').focus();
}

document.addEventListener("keydown",e=>{
  if(!sess)return;
  const tag=e.target&&e.target.tagName;
  // Inside a dropdown (match questions): arrows/space pick a value natively; Enter submits.
  if(tag==="SELECT"){
    if(e.key==="Enter"){const b=document.getElementById("submitBtn");if(b&&!b.disabled){e.preventDefault();b.click();}}
    return;
  }
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  const q=sess.qs[sess.i];
  const isOpt=q&&(q.y==="mc"||q.y==="multi");
  if(e.key>="1"&&e.key<="9"){if(isOpt&&!sess.answered){const i=+e.key-1;if(i<q.o.length){sess.cursor=i;pickOpt(i)}}return;}
  if(isOpt&&!sess.answered&&(e.key==="ArrowDown"||e.key==="ArrowRight")){e.preventDefault();sess.cursor=Math.min(q.o.length-1,(sess.cursor<0?-1:sess.cursor)+1);updateCursor();return;}
  if(isOpt&&!sess.answered&&(e.key==="ArrowUp"||e.key==="ArrowLeft")){e.preventDefault();sess.cursor=Math.max(0,(sess.cursor<0?0:sess.cursor)-1);updateCursor();return;}
  if(e.key===" "||e.key==="Spacebar"){
    if(isOpt&&!sess.answered){
      e.preventDefault();
      if(q.y==="mc"&&sess.defer&&sess.sel.has(sess.cursor))submitA();
      else pickOpt(sess.cursor);
      return;
    }
    if(tag==="BUTTON")return; // let the focused button handle its own space
    const b=document.getElementById("submitBtn");if(b&&!b.disabled){e.preventDefault();b.click();return;}
  }
  if(e.key==="Enter"){if(tag==="BUTTON")return;const b=document.getElementById("submitBtn");if(b&&!b.disabled){e.preventDefault();b.click()}}
});
/* ---- optional sign-in & cross-device progress sync (Puter.js) ----
   Loads the Puter SDK at runtime; if it can't load (offline, blocked),
   the button stays hidden and the app runs local-only. */
const KVKEY="pamdef_stats_v1";
let user=null,puterReady=false,pushT=null;
function loadPuter(){
  return new Promise(res=>{
    if(window.puter){res(true);return}
    const s=document.createElement("script");
    s.src="https://js.puter.com/v2/";
    s.onload=()=>res(!!window.puter);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(!!window.puter),9000);
  });
}
async function initAuth(){
  if(window.__IOS_APP__)return; // native wrapper: on-device progress only, no popup sign-in
  puterReady=await loadPuter();
  if(!puterReady)return;
  const btn=document.getElementById("acctBtn");
  if(btn)btn.style.display="";
  try{
    if(puter.auth.isSignedIn()){
      user=await puter.auth.getUser();
      await pullCloud();
      if(!sess)home();
    }
  }catch(e){}
  renderAcct();
}
async function acctClick(){
  if(!puterReady)return;
  if(user){
    if(confirm("Sign out? Your progress stays saved in your account and on this device.")){
      try{puter.auth.signOut()}catch(e){}
      user=null;renderAcct();
    }
    return;
  }
  try{
    await puter.auth.signIn();
    user=await puter.auth.getUser();
    await pullCloud();
    renderAcct();
    if(!sess)home();
  }catch(e){/* popup closed */}
}
function renderAcct(){
  const btn=document.getElementById("acctBtn");
  if(!btn)return;
  btn.classList.toggle("on",!!user);
  btn.textContent=user?"☁ "+user.username:"Sign in to sync";
  btn.title=user?"Progress is syncing to your account. Click to sign out.":"Sign in (free) to keep your progress across devices";
}
async function pullCloud(){
  try{
    const raw=await puter.kv.get(KVKEY);
    if(raw){
      const remote=typeof raw==="string"?JSON.parse(raw):raw;
      for(const n in remote){
        const r=remote[n],l=S.stats[n];
        if(r&&r.seen&&(!l||r.seen>l.seen))S.stats[n]=r;
      }
      save();
    }
  }catch(e){}
  pushCloud(0);
}
function pushCloud(delay){
  if(!user||!puterReady)return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{try{puter.kv.set(KVKEY,JSON.stringify(S.stats))}catch(e){}},delay===0?0:1500);
}
home();
initAuth();
